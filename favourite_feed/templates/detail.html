<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ listing.title }}</title><link rel="stylesheet" href="{{ url_for('static',filename='feed.css') }}"></head><body><header><a href="/">Back to feed</a></header><main><h2>{{ listing.title }}</h2><p>{{ listing.shop_name }}</p><section class="photos">{% for photo in images %}<a href="{{ photo.image_url }}" target="_blank" rel="noopener"><img loading="lazy" src="{{ photo.image_url }}" alt="Listing photograph"></a>{% endfor %}</section><p class="description">{{ listing.description }}</p>{% if listing.listing_url and listing.listing_url.startswith('https://www.etsy.com/') %}<a href="{{ listing.listing_url }}" target="_blank" rel="noopener">View on Etsy (preview only)</a>{% endif %}</main></body></html>
