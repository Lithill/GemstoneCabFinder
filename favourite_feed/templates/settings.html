<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feed settings</title><link rel="stylesheet" href="{{ url_for('static',filename='feed.css') }}"></head><body><header><h1>Settings</h1><a href="/">Back to feed</a></header><main style="max-width:650px"><form method="post"><h2>Excluded title keywords</h2><p>One word or phrase per line. Matches whole words, ignoring case and punctuation.</p><textarea name="exclusions" rows="12" style="width:100%;font:inherit;padding:12px">{{ settings.exclusions|join('\n') }}</textarea><p><label><input type="checkbox" name="show_excluded" {% if settings.show_excluded %}checked{% endif %}> Show excluded listings</label></p><h2>Preferred title keywords</h2><textarea name="preferences" rows="8" style="width:100%;font:inherit;padding:12px">{{ settings.preferences|join('\n') }}</textarea><p><label><input type="checkbox" name="preferred_only" {% if settings.preferred_only %}checked{% endif %}> Only show titles matching preferred keywords</label></p><button type="submit">Save settings</button></form></main><script src="{{ url_for('static',filename='refresh_worker.js') }}"></script></body></html>
