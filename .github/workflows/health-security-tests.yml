name: Dashboard regression tests (offline)
# Run automatically for changes to main and allow manual runs.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
# The workflow only needs read access to repository contents.
permissions:
  contents: read
jobs:
  offline-security:
    # Use a disposable GitHub-hosted Linux machine, not the deployed server.
    runs-on: ubuntu-latest
    # Stop a stuck job rather than consuming runner time indefinitely.
    timeout-minutes: 15
    steps:
      # Download the revision being tested.
      - uses: actions/checkout@v4
      # Select the Python version for this isolated test environment.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Install dependencies before importing application modules.
      - name: Install isolated test dependencies
        run: python -m pip install -r requirements.txt
      # Check selected Python modules for syntax errors without starting the application.
      - name: Compile staged security modules
        run: python -m py_compile favourite_feed/health_auth.py favourite_feed/health_vault.py favourite_feed/health_answers.py favourite_feed/health_entries.py favourite_feed/health_checkins.py favourite_feed/health_diary_bridge.py favourite_feed/health_api.py favourite_feed/health_staging.py scripts/health_vault_admin.py scripts/rehearse_health_recovery.py
      # Discover and execute the offline regression suite.
      - name: Run all offline regression tests
        run: python -m unittest discover -s tests -v
      # Exercise encrypted backup and restoration using fictional data.
      - name: Rehearse encrypted backup and recovery with fictional data
        run: python scripts/rehearse_health_recovery.py
